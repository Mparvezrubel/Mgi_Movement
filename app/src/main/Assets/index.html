<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MGI Movement Register</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#152238;--muted:#718096;--line:#e7edf5;--accent:#1264f5;--accent2:#7c3aed;--good:#0f9d68;--shadow:0 8px 24px rgba(29,52,84,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}button,input{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:10px 12px 20px}.top{position:sticky;top:0;z-index:5;padding:5px 0 9px;background:linear-gradient(var(--bg) 82%,transparent)}.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand h1{font-size:18px;margin:0;line-height:1.15}.brand small{color:var(--muted);font-size:10px}.icon{border:0;background:#fff;border-radius:13px;padding:9px 12px;box-shadow:var(--shadow);font-size:17px}.hero{padding:15px 16px;border-radius:21px;color:white;background:linear-gradient(135deg,#1264f5,#6d43e8);box-shadow:0 12px 28px rgba(30,80,190,.20)}.hero h2{margin:0 0 3px;font-size:20px}.hero p{margin:0;opacity:.88;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:9px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px;box-shadow:var(--shadow);min-width:0}.stat b{display:block;font-size:19px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stat span{font-size:10px;color:var(--muted)}.progress{height:6px;background:#edf2f8;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:12px 2px 7px}.section-title h3{margin:0;font-size:14px}.section-title span{font-size:10px;color:var(--muted)}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:15px;padding:11px;text-align:left;box-shadow:var(--shadow);cursor:pointer;min-height:60px}.btn strong{display:block;font-size:13px}.btn small{color:var(--muted);font-size:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden;margin-top:8px}.panelhead{padding:11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.panelhead b{font-size:12px}.search{border:1px solid var(--line);border-radius:10px;padding:7px 9px;width:135px;outline:none}.tablewrap{overflow:auto;max-height:52vh;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:950px;font-size:10px}th,td{padding:8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#f8fafc;color:#526277;z-index:1}td:nth-child(2),th:nth-child(2){text-align:left}.back{border:0;background:#eef4ff;color:var(--accent);padding:8px 10px;border-radius:10px;font-weight:600}.empty{padding:30px;text-align:center;color:var(--muted)}footer{margin-top:10px;text-align:center;color:#9aa6b6;font-size:9px}.error{margin-top:20px;background:#fff;border:1px solid #f1d0d0;border-radius:16px;padding:18px;color:#8b2c2c}
@media(min-width:600px){.buttons{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body><div class="app" id="app"><div class="empty">ডাটা লোড হচ্ছে…</div></div>
<script>
'use strict';
let D=null;
const $=s=>document.querySelector(s);
const fmt=n=>n==null||n===''?'—':(typeof n==='number'?n.toLocaleString(undefined,{maximumFractionDigits:1}):String(n));
const pct=n=>n==null||isNaN(n)?'—':(Number(n)*100).toFixed(1)+'%';
const safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function metrics(sh){
 const rows=(sh.rows||[]).filter(r=>r && r[1]!==null && r[1]!==undefined && String(r[1]).trim()!=='');
 const sum=i=>rows.reduce((a,r)=>a+(Number(r[i])||0),0);
 const target=sum(3),order=sum(4),memo=sum(5),outlet=sum(2),ims=sum(8);
 return {days:rows.length,target,order,memo,outlet,ims,achievement:target?order/target:0,strike:outlet?memo/outlet:0};
}
function home(){
 const ms=D.sheets.map(metrics), all={days:0,target:0,order:0,memo:0,outlet:0,ims:0};
 ms.forEach(m=>Object.keys(all).forEach(k=>all[k]+=m[k]||0));
 all.achievement=all.target?all.order/all.target:0;all.strike=all.outlet?all.memo/all.outlet:0;
 $('#app').innerHTML=`
 <div class="top"><div class="brand"><div><h1>MGI Movement Register</h1><small>2026 • Sales Performance</small></div><button class="icon" onclick="home()" aria-label="Refresh">↻</button></div></div>
 <div class="hero"><h2>Performance Dashboard</h2><p>${safe(D.meta.sr)} • ${safe(D.meta.db)} • ${safe(D.meta.territory)}</p></div>
 <div class="grid">
  <div class="stat"><span>Target Achievement</span><b>${pct(all.achievement)}</b><div class="progress"><i style="width:${Math.min(100,Math.max(0,all.achievement*100))}%"></i></div></div>
  <div class="stat"><span>Strike Rate</span><b>${pct(all.strike)}</b><div class="progress"><i style="width:${Math.min(100,Math.max(0,all.strike*100))}%"></i></div></div>
  <div class="stat"><span>Total Order</span><b>${fmt(all.order)}</b><span>Target ${fmt(all.target)}</span></div>
  <div class="stat"><span>IMS Total</span><b>${fmt(all.ims)}</b><span>${all.days} recorded days</span></div>
 </div>
 <div class="section-title"><h3>Register Sections</h3><span>${D.sheets.length} sheets</span></div>
 <div class="buttons">${D.sheets.map((s,i)=>{const m=metrics(s);return `<button class="btn" onclick="sheet(${i})"><strong>📊 ${safe(s.short)}</strong><small>${m.days} records • ${pct(m.achievement)} achievement</small></button>`}).join('')}</div>
 <div class="section-title"><h3>Quick Summary</h3><span>Monthly achievement</span></div>
 <div class="panel"><div class="tablewrap"><table><thead><tr><th>Month</th><th>Days</th><th>Target</th><th>Order</th><th>Achievement</th><th>Strike</th></tr></thead><tbody>${D.sheets.map(s=>{const m=metrics(s);return `<tr><td>${safe(s.short)}</td><td>${m.days}</td><td>${fmt(m.target)}</td><td>${fmt(m.order)}</td><td>${pct(m.achievement)}</td><td>${pct(m.strike)}</td></tr>`}).join('')}</tbody></table></div></div>
 <footer>Embedded data • MGI Movement Register-2026</footer>`;
}
function displayCell(v,j){if([6,10,12,15].includes(j))return pct(v);if(j===7)return v==null||v===''?'—':Number(v).toFixed(2)+'%';return fmt(v)}
function sheet(i){
 const s=D.sheets[i],m=metrics(s);
 $('#app').innerHTML=`<div class="top"><div class="brand"><button class="back" onclick="home()">← Dashboard</button><div style="text-align:right"><h1>${safe(s.short)} 2026</h1><small>${m.days} records</small></div></div></div>
 <div class="grid"><div class="stat"><span>Achievement</span><b>${pct(m.achievement)}</b></div><div class="stat"><span>Strike Rate</span><b>${pct(m.strike)}</b></div><div class="stat"><span>Order</span><b>${fmt(m.order)}</b></div><div class="stat"><span>IMS</span><b>${fmt(m.ims)}</b></div></div>
 <div class="panel"><div class="panelhead"><b>${safe(s.name)}</b><input class="search" id="q" type="search" placeholder="Search…" aria-label="Search"></div><div class="tablewrap"><table id="tbl"><thead><tr>${D.headers.map(h=>`<th>${safe(String(h).replaceAll('\\n',' '))}</th>`).join('')}</tr></thead><tbody>${(s.rows||[]).map(r=>`<tr>${r.map((v,j)=>`<td>${safe(displayCell(v,j))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
 const q=$('#q');q.oninput=()=>{const needle=q.value.trim().toLowerCase();document.querySelectorAll('#tbl tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(needle)?'':'none')};
}
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(x=>{if(!x||!Array.isArray(x.sheets)||!Array.isArray(x.headers))throw new Error('Invalid data format');D=x;home()}).catch(e=>{$('#app').innerHTML=`<div class="error"><b>ডাটা লোড করা যায়নি</b><p>অ্যাপের data.json ফাইলটি পরীক্ষা করুন।</p><small>${safe(e.message)}</small></div>`});
</script></body></html>
